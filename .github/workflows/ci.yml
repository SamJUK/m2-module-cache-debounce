name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: samjuk/github-actions/.github/workflows/magento2-module.yaml@7e9f3aa3e9ad108cfb0da3e1012d5dcf7e91ff0f # magento-module/v1.0.3
