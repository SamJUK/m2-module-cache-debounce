name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: samjuk/github-actions/.github/workflows/magento2-module.yaml@5efa1f810e48f98058307dccdff2b01b4d288d05 # magento-module/v1.0.4
